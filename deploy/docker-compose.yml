# Call: signaling server + coturn (TURN relay). Run ./setup.sh first; it writes .env.
name: call
services:
  server:
    build: ../server            # built from source inside Docker
    restart: unless-stopped
    ports: ["127.0.0.1:18095:8080"]   # nginx in front terminates HTTPS
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro         # optional: secrets/fcm.json (Firebase service account) enables push wake-ups
    env_file: .env
    environment: {FCM_KEY: /secrets/fcm.json}

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --external-ip=${TURN_EXTERNAL_IP}
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --total-quota=100
      - --log-file=stdout
      - --simple-log
